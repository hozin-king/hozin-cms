name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  test:
    name: node test.mjs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run local tests (mock D1, no secrets)
        run: node test.mjs
      - name: Install esbuild (pinned via package-lock.json)
        run: npm ci
      - name: Build bundle (minify inline scripts + bundle --minify)
        run: node build.mjs
      - name: Run tests against minified bundle
        run: npm run test:dist
